[package]
name = "voxel_engine"
version = "0.1.0"
edition = "2024"

[features]
default = []
dev-tools = []

[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
env_logger = "0.10"
log = "0.4"
wgpu = "27.0"
pollster = "0.3"
glam = { version = "0.29", features = ["serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
image = "0.25"
egui = "0.33"
egui-wgpu = "0.33"
egui-winit = "0.33"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
serde_json = "1.0"
gltf = { version = "1.4", features = ["extras"] }
rayon = "1.10"
lz4_flex = "0.11"

[profile.release]
lto = true
codegen-units = 1
